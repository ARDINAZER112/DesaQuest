function IconBase(props) {

    <svg

      height={size}
      viewBox="0 0 24 24"

      stroke="currentColor"
      strokeWidth="2"
      strokeLinecap="round"
      strokeLinejoin="round"
      className={props.className || ""}
      dangerouslySetInnerHTML={{ __html: ICON_PATHS[props.name] }}
    />
  );
}

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = (d) => (d * Math.PI) / 180;
  const dLat = toRad(lat2 - lat1),
    dLon = toRad(lon2 - lon1);
  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function levelInfo(xp) {
  const perLevel = 500;
  const level = Math.floor((xp || 0) / perLevel) + 1;
  const into = (xp || 0) % perLevel;
  return { level, into, need: perLevel, pct: Math.round((into / perLevel) * 100) };
}

function fmtDate(ts) {
  const d = new Date(ts);
  return (
    d.toLocaleDateString("id-ID", { day: "2-digit", month: "short", year: "numeric" }) +
    ", " +
    d.toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" })
  );
}

function todayKey(ts) {
  return new Date(ts).toISOString().slice(0, 10);
}

function initials(name) {
  return (name || "?")
    .split(" ")
    .map((w) => w[0])
    .slice(0, 2)
    .join("")
    .toUpperCase();
}


/* ===== lib/storage.js ===== */
// Lapisan penyimpanan sederhana berbasis localStorage.
// Cocok untuk prototipe/demo tanpa backend. Data hanya tersimpan di browser
// pengguna masing-masing (tidak sinkron antar perangkat).
// Untuk produksi sungguhan, ganti modul ini dengan panggilan API ke backend
// asli (mis. Supabase, Firebase, atau REST API + database) agar data admin,
// petugas, dan warga benar-benar tersimpan di server bersama.

function storageGet(key) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    console.error("storageGet error:", e);
    return null;
  }
}

function storageSet(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
    return true;
  } catch (e) {
    console.error("storageSet error:", e);
    return false;
  }
}

function storageRemove(key) {
  try {
    localStorage.removeItem(key);
  } catch (e) {
    console.error("storageRemove error:", e);
  }
}

// Memanggil callback setiap kali key berubah di TAB LAIN pada browser yang sama
// (event 'storage' tidak terpicu di tab yang melakukan perubahan itu sendiri).
function onStorageChange(key, callback) {
  const handler = (e) => {
    if (e.key === key) {
      try {
        callback(e.newValue ? JSON.parse(e.newValue) : null);
      } catch (err) {
        console.error("onStorageChange parse error:", err);
      }
    }
  };
  window.addEventListener("storage", handler);
  return () => window.removeEventListener("storage", handler);
}

function AuthScreen({
  onLogin,
  onRegister,
  quests,
  wargaCount,
  reportCount,
  authError,
  setAuthError,
}) {
  const [mode, setMode] = useState("login");
  const [showPw, setShowPw] = useState(false);
  const [showDemo, setShowDemo] = useState(false);
  const [login, setLogin] = useState({ username: "", password: "" });
  const [reg, setReg] = useState({ name: "", username: "", password: "", confirm: "" });
  const [busy, setBusy] = useState(false);

  const submitLogin = async () => {
    setAuthError("");
    if (!login.username.trim() || !login.password) {
      setAuthError("Isi username dan kata sandi.");
      return;
    }
    setBusy(true);
    await onLogin(login.username.trim(), login.password);
    setBusy(false);
  };

  const submitRegister = async () => {
    setAuthError("");
    if (!reg.name.trim() || !reg.username.trim() || !reg.password) {
      setAuthError("Lengkapi semua data.");
      return;
    }
    if (reg.password.length < 6) {
      setAuthError("Kata sandi minimal 6 karakter.");
      return;
    }
    if (reg.password !== reg.confirm) {
      setAuthError("Konfirmasi kata sandi tidak cocok.");
      return;
    }
    setBusy(true);
    const ok = await onRegister(reg.name.trim(), reg.username.trim(), reg.password);
    setBusy(false);
    if (ok) setMode("login");
  };

  return (
    <div
      className="min-h-screen flex items-center justify-center p-4"

function AdminRewards({ db, saveReward, deleteReward, fulfillRedemption }) {
  const [editing, setEditing] = useState(null); // null | 'new' | id
  const [form, setForm] = useState({ name: "", icon: "🎁", xpCost: 500, stock: 10 });
  const openForm = (rw) => {
    if (rw) {
      setForm({ name: rw.name, icon: rw.icon, xpCost: rw.xpCost, stock: rw.stock });
      setEditing(rw.id);
    } else {
      setForm({ name: "", icon: "🎁", xpCost: 500, stock: 10 });
      setEditing("new");
    }
  };
  const submit = () => {
    if (!form.name.trim() || !form.xpCost) return;
    saveReward(editing, {
      ...form,
      xpCost: parseInt(form.xpCost, 10),
      stock: parseInt(form.stock, 10),
    });
    setEditing(null);
  };
  return (
    <>
      <Panel
        title="Kelola Reward"
        action={
          <Btn size="sm" variant="green" onClick={() => openForm(null)}>
            <PlusCircle size={14} />
            Tambah Reward
          </Btn>
        }
      >
        <div className="overflow-x-auto">
          <table className="w-full text-[13px]">
            <thead>
              <tr className="text-left text-slate-400 text-[11px] uppercase border-b border-slate-100">
                <th className="py-2 pr-3">Reward</th>
                <th className="py-2 pr-3">Biaya XP</th>
                <th className="py-2 pr-3">Stok</th>
                <th className="py-2">Aksi</th>
              </tr>
            </thead>
            <tbody>
              {db.rewards.map((r) => (
                <tr key={r.id} className="border-b border-slate-50 last:border-0">
                  <td className="py-2.5 pr-3">
                    {r.icon} {r.name}
                  </td>
                  <td className="py-2.5 pr-3">{r.xpCost.toLocaleString("id-ID")} XP</td>
                  <td className="py-2.5 pr-3">{r.stock}</td>
                  <td className="py-2.5 flex gap-2">
                    <Btn size="sm" variant="outline" onClick={() => openForm(r)}>
                      <Pencil size={13} />
                    </Btn>
                    <Btn size="sm" variant="danger" onClick={() => deleteReward(r.id)}>
                      <Trash2 size={13} />
                    </Btn>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </Panel>

      {editing && (
        <div
          className="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50"
          onClick={(e) => e.target === e.currentTarget && setEditing(null)}
        >
          <div className="bg-white rounded-2xl p-6 max-w-sm w-full">
            <h3 className="font-bold text-slate-800 mb-4">
              {editing === "new" ? "Tambah" : "Edit"} Reward
            </h3>
            <Field label="Nama Reward">
              <input
                className={inputCls}
                value={form.name}
                onChange={(e) => setForm({ ...form, name: e.target.value })}
              />
            </Field>
            <Field label="Emoji Ikon">
              <input
                className={inputCls}
                value={form.icon}
                onChange={(e) => setForm({ ...form, icon: e.target.value })}
              />
            </Field>
            <div className="grid grid-cols-2 gap-3">
              <Field label="Biaya XP">
                <input
                  type="number"
                  className={inputCls}
                  value={form.xpCost}
                  onChange={(e) => setForm({ ...form, xpCost: e.target.value })}
                />
              </Field>
              <Field label="Stok">
                <input
                  type="number"
                  className={inputCls}
                  value={form.stock}
                  onChange={(e) => setForm({ ...form, stock: e.target.value })}
                />
              </Field>
            </div>
            <div className="flex gap-2 mt-2">
              <Btn variant="outline" className="flex-1" onClick={() => setEditing(null)}>
                Batal
              </Btn>
              <Btn variant="green" className="flex-1" onClick={submit}>
                Simpan
              </Btn>
            </div>
          </div>
        </div>
      )}

      <Panel title="Riwayat Penukaran Reward">
        {db.redemptions.length === 0 ? (
          <Empty icon="🎁" text="Belum ada penukaran reward." />

          <div className="overflow-x-auto">
            <table className="w-full text-[13px]">
              <thead>
                <tr className="text-left text-slate-400 text-[11px] uppercase border-b border-slate-100">
                  <th className="py-2 pr-3">Warga</th>
                  <th className="py-2 pr-3">Reward</th>

                  <th className="py-2 pr-3">Status</th>

                      </tr>
                    );
                  })}
              </tbody>
            </table>
          </div>
        )}
      </Panel>
    </>
  );

function QuestForm({ quest, onSave, onCancel }) {
  const [f, setF] = useState(
    quest
      ? { ...quest, lat: quest.loc.lat, lng: quest.loc.lng }
      : {
          title: "",
          desc: "",
          category: "Jalan",
          status: "aktif",
          xpBase: 100,
          xpBonus: 20,
          start: "",
          end: "",
          lat: "",
          lng: "",
          radius: 100,
        }
  );
  const set = (k, v) => setF({ ...f, [k]: v });
  const grabLocation = () => {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(
      (pos) =>
        setF((prev) => ({
          ...prev,
          lat: pos.coords.latitude.toFixed(6),
          lng: pos.coords.longitude.toFixed(6),
        })),
      () => {}
    );
  };
  const submit = () => {
    if (!f.title.trim() || f.lat === "" || f.lng === "") return;
    const icon =
      { Jalan: "🛣️", Drainase: "💧", Jembatan: "🌉", "Fasilitas Umum": "🏛️", Lainnya: "🚧" }[
        f.category
      ] || "🚧";
    onSave({
      id: quest?.id,
      title: f.title.trim(),
      desc: f.desc.trim(),
      category: f.category,
      icon,
      loc: { lat: parseFloat(f.lat), lng: parseFloat(f.lng) },
      radius: parseInt(f.radius, 10),
      xpBase: parseInt(f.xpBase, 10),
      xpBonus: parseInt(f.xpBonus || 0, 10),

      end: f.end,
      status: f.status,

function WargaQuestDetail({ user, db, questId, back, submitReport, hasReportedToday }) {
  const q = db.quests.find((x) => x.id === questId);
  const [draft, setDraft] = useState({});
  const [gpsBusy, setGpsBusy] = useState(false);
  const fileRef = useRef(null);

  if (!q)
    return (
      <Panel>
        <button onClick={back} className="text-sm text-green-700 font-bold mb-2">
          ← Kembali
        </button>
        <p>Misi tidak ditemukan.</p>
      </Panel>
    );

  const myR = db.reports
    .filter((r) => r.userId === user.id && r.questId === q.id)
    .sort((a, b) => b.ts - a.ts);
  const already = hasReportedToday(q.id, user.id);
  const valid = draft.distance !== undefined ? draft.distance <= q.radius : null;

  const handlePhoto = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        const maxW = 480;
        const scale = Math.min(1, maxW / img.width);
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        setDraft((d) => ({ ...d, photo: canvas.toDataURL("image/jpeg", 0.6) }));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };
  const checkGPS = () => {
    setGpsBusy(true);
    if (!navigator.geolocation) {
      setGpsBusy(false);
      setDraft((d) => ({ ...d, gpsError: "no-geo" }));
      return;
    }
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const dist = Math.round(
          haversine(pos.coords.latitude, pos.coords.longitude, q.loc.lat, q.loc.lng)
        );
        setDraft((d) => ({
          ...d,
          lat: pos.coords.latitude,
          lng: pos.coords.longitude,
          distance: dist,
          gpsError: null,
        }));
        setGpsBusy(false);
      },
      () => {
        setGpsBusy(false);
        setDraft((d) => ({ ...d, gpsError: "denied" }));
      },
      { enableHighAccuracy: true, timeout: 8000 }
    );
  };
  const simulateLocation = (mode) => {
    let lat, lng;
    if (mode === "valid") {
      lat = q.loc.lat + (Math.random() - 0.5) * 0.0006;
      lng = q.loc.lng + (Math.random() - 0.5) * 0.0006;
    } else {
      lat = q.loc.lat + 0.02 + Math.random() * 0.01;
      lng = q.loc.lng + 0.02;
    }
    const dist = Math.round(haversine(lat, lng, q.loc.lat, q.loc.lng));
    setDraft((d) => ({ ...d, lat, lng, distance: dist, gpsError: null }));
  };
  const send = () => {
    if (!draft.photo || draft.distance === undefined || draft.distance > q.radius) return;
    submitReport(q, draft);
    setDraft({});
  };

  const infoCards = (
    <div className="grid grid-cols-2 lg:grid-cols-4 gap-3.5 mb-5">
      <div className="bg-white rounded-xl p-3.5 border border-slate-100">
        <span className="text-[11px] text-slate-400 block">Status</span>
        <Tag status={q.status} />
      </div>
      <div className="bg-white rounded-xl p-3.5 border border-slate-100">
        <span className="text-[11px] text-slate-400 block">Kategori</span>
        <b className="text-[13px]">{q.category}</b>
      </div>
      <div className="bg-white rounded-xl p-3.5 border border-slate-100">
        <span className="text-[11px] text-slate-400 block">Periode</span>
        <b className="text-[13px]">
          {q.start} – {q.end}
        </b>
      </div>
      <div className="bg-white rounded-xl p-3.5 border border-slate-100">
        <span className="text-[11px] text-slate-400 block">Radius Wajib</span>
        <b className="text-[13px]">{q.radius} meter</b>
      </div>
    </div>
  );

  return (
    <div>
      <button onClick={back} className="text-[12px] text-green-700 font-bold mb-2">
        ← Kembali ke Daftar Misi
      </button>
      <h2 className="font-bold text-slate-800 text-xl mb-1">
        {q.icon} {q.title}
      </h2>
      <p className="text-[13px] text-slate-500 mb-5 max-w-2xl">{q.desc}</p>

      <div className="grid lg:grid-cols-2 gap-5 items-start">
        <div>
          {infoCards}
          <Panel title="Lokasi Proyek">
            <div className="text-center">
              <div className="relative w-32 h-32 mx-auto mb-2.5">
                <div className="absolute inset-0 rounded-full border-2 border-dashed border-green-300 bg-green-50" />
                <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-2xl">
                  📍
                </div>
              </div>
              <small className="text-slate-400 text-xs">
                Foto laporan wajib diambil dalam radius <b>{q.radius} meter</b> dari titik lokasi
                proyek.
              </small>
            </div>
          </Panel>
          <Panel title="Riwayat Laporanmu di Misi Ini">
            {myR.length === 0 ? (
              <Empty icon="📄" text="Belum ada laporan." />
            ) : (
              myR.map((r) => (
                <div
                  key={r.id}
                  className="flex items-center gap-2.5 py-2.5 border-b border-slate-100 last:border-0"
                >
                  {r.photo ? (
                    <img src={r.photo} className="w-11 h-11 rounded-lg object-cover" />
                  ) : (
                    <div className="w-11 h-11 rounded-lg bg-slate-100" />
                  )}
                  <div className="flex-1">
                    <b className="text-[12.5px] block">{fmtDate(r.ts)}</b>
                    <span className="text-[11px] text-slate-400">{r.distance} m dari lokasi</span>
                  </div>
                  <Tag status={r.status} />
                </div>
              ))
            )}
          </Panel>
        </div>

        <div>
          {already ? (
            <Panel>
              <div className="text-center">
                <div className="text-lg mb-1">
                  ✅ <b>Kamu sudah mengirim laporan hari ini.</b>
                </div>
                <small className="text-slate-400">Kembali lagi besok untuk melapor lagi.</small>
              </div>
            </Panel>
          ) : (
            <Panel title="Kirim Laporan Foto Hari Ini">
              <div
                onClick={() => fileRef.current?.click()}
                className="border-2 border-dashed border-slate-200 rounded-xl p-8 text-center text-slate-400 text-[12.5px] cursor-pointer"
              >
                {draft.photo ? (
                  <>
                    <img src={draft.photo} className="max-h-36 mx-auto rounded-lg mb-2" />
                    <span>Ganti foto</span>
                  </>
                ) : (
                  <>
                    <Camera className="mx-auto mb-1.5" size={28} />
                    <span>Klik untuk ambil / unggah foto bukti</span>
                  </>
                )}
              </div>
              <input
                ref={fileRef}
                type="file"
                accept="image/*"
                capture="environment"
                className="hidden"
                onChange={handlePhoto}
              />

              <div className="mt-3">
                {draft.distance === undefined ? (
                  <>
                    <Btn variant="outline" className="w-full" disabled={gpsBusy} onClick={checkGPS}>
                      {gpsBusy ? (
                        <Loader2 size={15} className="animate-spin" />
                      ) : (
                        <MapPin size={15} />
                      )}{" "}
                      {gpsBusy ? "Mengambil lokasi..." : "Cek Lokasi GPS Saya"}
                    </Btn>
                    {draft.gpsError && (
                      <div className="mt-2.5 text-[12px] text-slate-500">
                        ⚠️ Browser menolak/tidak mendukung akses GPS. Gunakan simulasi untuk mencoba
                        alur validasi, atau izinkan akses lokasi di pengaturan browser:
                        <div className="flex gap-2 mt-2">
                          <Btn
                            size="sm"
                            variant="green"
                            className="flex-1"
                            onClick={() => simulateLocation("valid")}
                          >
                            Simulasi: Di Lokasi
                          </Btn>
                          <Btn
                            size="sm"
                            variant="outline"
                            className="flex-1"
                            onClick={() => simulateLocation("invalid")}
                          >
                            Simulasi: Di Luar Radius
                          </Btn>
                        </div>
                      </div>
                    )}
                  </>
                ) : (
                  <>
                    <div
                      className={`rounded-xl px-3.5 py-2.5 text-[13px] font-semibold flex items-center gap-2 ${
                        valid ? "bg-green-50 text-green-700" : "bg-red-50 text-red-600"
                      }`}
                    >
                      {valid ? <CheckCircle2 size={15} /> : <XCircle size={15} />} Jarak kamu{" "}
                      {draft.distance} m dari lokasi —{" "}
                      {valid ? "dalam radius, valid!" : `di luar radius (${q.radius} m).`}
                    </div>
                    <button
                      className="text-xs text-green-700 font-semibold mt-2"
                      onClick={() => setDraft((d) => ({ ...d, distance: undefined }))}
                    >
                      Cek Ulang Lokasi
                    </button>
                  </>
                )}
              </div>
              <Btn
                variant="green"
                className="w-full mt-3"
                disabled={!draft.photo || draft.distance === undefined || draft.distance > q.radius}
                onClick={send}
              >
                <Send size={15} /> Kirim Laporan
              </Btn>
            </Panel>
          )}
        </div>
      </div>
    </div>
  );
}

/* ===== App.jsx ===== */

























const wargaNav = [
  ["beranda", Home, "Beranda"],
  ["misi", Target, "Misi"],
  ["reward", Gift, "Reward"],
  ["profil", User, "Profil"],
];

function App() {
  const [db, setDb] = useState(null);
  const [loading, setLoading] = useState(true);
  const [session, setSession] = useState(null); // {userId}
  const [authError, setAuthError] = useState("");
  const [page, setPage] = useState("dashboard");
  const [selectedQuestId, setSelectedQuestId] = useState(null);
  const [editingQuestId, setEditingQuestId] = useState(null); // null | 'new' | id
  const [toast, setToast] = useState(null);

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 2600);
  };

  // boot: load db + session from localStorage
  useEffect(() => {
    let d = storageGet(DB_KEY);
    if (!d) {
      d = seedDB();
      storageSet(DB_KEY, d);
    }
    setDb(d);
    const sess = storageGet(SESSION_KEY);
    if (sess && sess.userId && d.users.find((u) => u.id === sess.userId)) {
      setSession(sess);
      const u = d.users.find((u) => u.id === sess.userId);
      setPage(u.role === "warga" ? "beranda" : "dashboard");
    }
    setLoading(false);
  }, []);

  // keep multiple tabs of the same browser in sync automatically
  useEffect(() => {
    const off = onStorageChange(DB_KEY, (fresh) => {
      if (fresh) setDb(fresh);
    });
    return off;
  }, []);

  const persist = (next) => {
    setDb(next);
    storageSet(DB_KEY, next);
  };
  const mutate = (fn) => {
    const next = JSON.parse(JSON.stringify(db));
    fn(next);
    persist(next);
  };

  const user = db && session ? db.users.find((u) => u.id === session.userId) : null;

  /* ---------- auth actions ---------- */
  const doLogin = async (username, password) => {
    const u = db.users.find((x) => x.username.toLowerCase() === username.toLowerCase());
    if (!u || u.password !== password) {
      setAuthError("Username atau kata sandi salah.");
      return;
    }
    const sess = { userId: u.id };
    setSession(sess);
    storageSet(SESSION_KEY, sess);
    setPage(u.role === "warga" ? "beranda" : "dashboard");
  };
  const doRegister = async (name, username, password) => {
    if (db.users.some((x) => x.username.toLowerCase() === username.toLowerCase())) {
      setAuthError("Username sudah digunakan, coba yang lain.");
      return false;
    }
    const newUser = { id: uid("w"), name, username, password, role: "warga", xp: 0 };
    mutate((d) => d.users.push(newUser));
    const sess = { userId: newUser.id };
    setSession(sess);
    storageSet(SESSION_KEY, sess);
    setPage("beranda");
    showToast("Pendaftaran berhasil! Selamat datang di DesaQuest.");
    return true;
  };
  const logout = () => {
    setSession(null);
    storageSet(SESSION_KEY, null);
    setPage("dashboard");
    setSelectedQuestId(null);
    setEditingQuestId(null);
  };

  /* ---------- shared helpers ---------- */
  const hasReportedToday = (questId, userId) => {
    const today = todayKey(Date.now());
    return db.reports.some(
      (r) => r.questId === questId && r.userId === userId && todayKey(r.ts) === today
    );
  };

  /* ---------- petugas actions ---------- */
  const saveQuest = (data) => {
    if (!data.id) {
      mutate((d) => d.quests.push({ ...data, id: uid("q"), createdBy: session.userId }));
      showToast("Quest baru berhasil dibuat!");
    } else {
      mutate((d) => {
        const q = d.quests.find((x) => x.id === data.id);
        Object.assign(q, data);
      });
      showToast("Quest berhasil diperbarui.");
    }
    setEditingQuestId(null);
    setPage("daftar-quest");
  };
  const deleteQuest = (id) => {
    if (!window.confirm("Hapus quest ini beserta seluruh laporannya?")) return;
    mutate((d) => {
      d.quests = d.quests.filter((q) => q.id !== id);
      d.reports = d.reports.filter((r) => r.questId !== id);
    });
    showToast("Quest dihapus.");
  };
  const verifyReport = (reportId, action, xpInput) => {
    let msg = "";
    mutate((d) => {
      const r = d.reports.find((x) => x.id === reportId);
      if (!r) return;
      if (action === "approve") {
        const q = d.quests.find((x) => x.id === r.questId);
        const xp = parseInt(xpInput, 10) || q.xpBase;
        r.status = "approved";
        r.xpAwarded = xp;
        const u = d.users.find((x) => x.id === r.userId);
        if (u) u.xp = (u.xp || 0) + xp;
        msg = `Laporan disetujui, +${xp} XP untuk ${u ? u.name : "warga"}.`;
      } else {
        r.status = "rejected";
        r.xpAwarded = 0;
        msg = "Laporan ditolak.";
      }
    });
    showToast(msg);
  };

  /* ---------- warga actions ---------- */
  const submitReport = (quest, draft) => {
    const report = {
      id: uid("r"),
      questId: quest.id,
      userId: session.userId,
      photo: draft.photo,
      ts: Date.now(),
      lat: draft.lat,
      lng: draft.lng,
      distance: draft.distance,
      status: "pending",
      xpAwarded: 0,
    };
    mutate((d) => d.reports.push(report));
    showToast("Laporan terkirim! Menunggu verifikasi petugas.");
  };
  const redeemReward = (rewardId) => {
    const rw = db.rewards.find((r) => r.id === rewardId);
    if (!rw || rw.stock <= 0) {
      showToast("Stok reward habis.");
      return;
    }
    if ((user.xp || 0) < rw.xpCost) {
      showToast("XP kamu belum cukup untuk menukar reward ini.");
      return;
    }
    if (!window.confirm(`Tukar ${rw.xpCost} XP dengan "${rw.name}"?`)) return;
    mutate((d) => {
      const u = d.users.find((x) => x.id === session.userId);
      const r = d.rewards.find((x) => x.id === rewardId);
      u.xp -= r.xpCost;
      r.stock -= 1;
      d.redemptions.push({
        id: uid("rd"),
        userId: u.id,
        rewardId: r.id,
        ts: Date.now(),
        status: "menunggu",
      });
    });
    showToast("Berhasil ditukar! Ambil reward di kantor desa.");
  };
  const sendFeedback = (text) => {
    if (!text.trim()) return;
    mutate((d) =>
      d.feedback.push({
        id: uid("f"),
        userId: session.userId,
        message: text.trim(),
        ts: Date.now(),
        status: "baru",
      })
    );
    showToast("Masukan terkirim ke admin. Terima kasih!");
  };

  /* ---------- admin actions ---------- */
  const setFeedbackStatus = (id, status) =>
    mutate((d) => {
      const f = d.feedback.find((x) => x.id === id);
      if (f) f.status = status;
    });
  const deleteUser = (id) => {
    if (!window.confirm("Hapus pengguna ini?")) return;
    mutate((d) => {
      d.users = d.users.filter((u) => u.id !== id);
    });
  };
  const addPetugas = (name, username, password) => {
    if (db.users.some((x) => x.username.toLowerCase() === username.toLowerCase())) {
      showToast("Username sudah digunakan.");
      return;
    }
    mutate((d) => d.users.push({ id: uid("p"), name, username, password, role: "petugas" }));
    showToast("Akun petugas baru berhasil dibuat.");
  };
  const saveReward = (editing, data) => {
    if (editing === "new") mutate((d) => d.rewards.push({ ...data, id: uid("rw") }));
    else
      mutate((d) => {
        Object.assign(
          d.rewards.find((r) => r.id === editing),
          data
        );
      });
    showToast("Reward tersimpan.");
  };
  const deleteReward = (id) => {
    if (!window.confirm("Hapus reward ini?")) return;
    mutate((d) => {
      d.rewards = d.rewards.filter((r) => r.id !== id);
    });
  };
  const fulfillRedemption = (id) => {
    mutate((d) => {
      const rd = d.redemptions.find((x) => x.id === id);
      if (rd) rd.status = "diambil";
    });
    showToast("Ditandai sudah diambil.");
  };

  /* ---------- render guards ---------- */
  if (loading || !db) {
    return (
      <div className="min-h-screen flex items-center justify-center text-slate-400 gap-2">
        <Loader2 className="animate-spin" size={18} />
        Memuat DesaQuest...
      </div>
    );
  }

  if (!session || !user) {
    return (
      <>
        <AuthScreen
          onLogin={doLogin}
          onRegister={doRegister}
          quests={db.quests}
          wargaCount={db.users.filter((u) => u.role === "warga").length}
          reportCount={db.reports.length}
          authError={authError}
          setAuthError={setAuthError}
        />
        <Toast message={toast} />
      </>
    );
  }

  /* ---------- ADMIN ---------- */
  if (user.role === "admin") {
    const nav = [
      ["dashboard", LayoutDashboard, "Dashboard"],
      ["feedback", MessageSquare, "Kritik & Saran"],
      ["pengguna", Users, "Kelola Pengguna"],
      ["reward-admin", Gift, "Kelola Reward"],
    ];
    const titles = {
      dashboard: ["Dashboard Admin", "Ringkasan sistem DesaQuest"],
      feedback: ["Kritik & Saran", "Kelola masukan dari warga"],
      pengguna: ["Kelola Pengguna", "Daftar seluruh pengguna sistem"],
      "reward-admin": ["Kelola Reward", "Atur katalog reward & penukaran"],
    };
    const [t, s] = titles[page] || titles.dashboard;
    return (
      <>
        <Shell
          brandRole="Admin"
          user={user}
          navItems={nav}
          page={page}
          setPage={setPage}
          onLogout={logout}
          title={t}
          subtitle={s}
        >
          {page === "feedback" && <AdminFeedback db={db} setStatus={setFeedbackStatus} />}
          {page === "pengguna" && (
            <AdminUsers db={db} deleteUser={deleteUser} addPetugas={addPetugas} />
          )}
          {page === "reward-admin" && (
            <AdminRewards
              db={db}
              saveReward={saveReward}
              deleteReward={deleteReward}
              fulfillRedemption={fulfillRedemption}
            />
          )}
          {(page === "dashboard" || !["feedback", "pengguna", "reward-admin"].includes(page)) && (
            <AdminDashboard db={db} />
          )}
        </Shell>
        <Toast message={toast} />
      </>
    );
  }

  /* ---------- PETUGAS ---------- */
  if (user.role === "petugas") {
    const nav = [
      ["dashboard", LayoutDashboard, "Dashboard"],
      ["buat-quest", PlusCircle, "Buat Quest Baru"],
      ["daftar-quest", ClipboardList, "Daftar Quest"],
      ["verifikasi", CheckCircle2, "Verifikasi Laporan"],
    ];
    const titles = {
      dashboard: ["Dashboard Petugas", "Kelola quest pembangunan desa & pantau partisipasi warga"],
      "buat-quest": ["Buat Quest Baru", "Tentukan tugas pemantauan untuk warga"],
      "daftar-quest": ["Daftar Quest", "Semua quest yang pernah dibuat"],
      verifikasi: ["Verifikasi Laporan", "Tinjau laporan foto dari warga"],
    };
    const [t, s] = titles[page] || titles.dashboard;
    return (
      <>
        <Shell
          brandRole="Petugas Desa"
          user={user}
          navItems={nav}
          page={page}
          setPage={(p) => {
            setPage(p);
            if (p === "buat-quest") setEditingQuestId("new");
          }}
          onLogout={logout}
          title={t}
          subtitle={s}
        >
          {page === "buat-quest" && (
            <QuestForm
              quest={
                editingQuestId && editingQuestId !== "new"
                  ? db.quests.find((q) => q.id === editingQuestId)
                  : null
              }
              onSave={saveQuest}
              onCancel={() => {
                setEditingQuestId(null);
                setPage("daftar-quest");
              }}
            />
          )}
          {page === "daftar-quest" && (
            <QuestList
              db={db}
              onEdit={(id) => {
                setEditingQuestId(id);
                setPage("buat-quest");
              }}
              onDelete={deleteQuest}
            />
          )}
          {page === "verifikasi" && <VerifikasiLaporan db={db} verify={verifyReport} />}
          {(page === "dashboard" ||
            !["buat-quest", "daftar-quest", "verifikasi"].includes(page)) && (
            <PetugasDashboard db={db} />
          )}
        </Shell>
        <Toast message={toast} />
      </>
    );
  }

  /* ---------- WARGA ---------- */
  const wPage = ["beranda", "misi", "misi-detail", "reward", "profil"].includes(page)
    ? page
    : "beranda";
  const wSelectedQuest =
    wPage === "misi-detail" ? db.quests.find((q) => q.id === selectedQuestId) : null;
  const wTitles = {
    beranda: [`Halo, ${user.name.split(" ")[0]} 👋`, "Terus pantau & bangun desamu."],
    misi: ["Daftar Misi", "Semua misi pemantauan yang bisa kamu ikuti"],
    "misi-detail": ["Detail Misi", wSelectedQuest ? wSelectedQuest.title : ""],
    reward: ["Tukar Reward", `Kamu punya ${(user.xp || 0).toLocaleString("id-ID")} XP`],
    profil: ["Profil", "Profil dan aktivitas kamu"],
  };
  const [wTitle, wSubtitle] = wTitles[wPage];
  return (
    <>
      <Shell
        brandRole="Warga Desa"
        user={user}
        navItems={wargaNav}
        page={wPage === "misi-detail" ? "misi" : wPage}
        setPage={(p) => {
          setPage(p);
          setSelectedQuestId(null);
        }}
        onLogout={logout}
        title={wTitle}
        subtitle={wSubtitle}
      >
        {wPage === "beranda" && (
          <WargaBeranda
            user={user}
            db={db}
            openQuest={(id) => {
              setSelectedQuestId(id);
              setPage("misi-detail");
            }}
            hasReportedToday={hasReportedToday}
          />
        )}
        {wPage === "misi" && (
          <WargaMisi
            user={user}
            db={db}
            openQuest={(id) => {
              setSelectedQuestId(id);
              setPage("misi-detail");
            }}
            hasReportedToday={hasReportedToday}
          />
        )}
        {wPage === "misi-detail" && (
          <WargaQuestDetail
            user={user}
            db={db}
            questId={selectedQuestId}
            back={() => setPage("misi")}
            submitReport={submitReport}
            hasReportedToday={hasReportedToday}
          />
        )}
        {wPage === "reward" && <WargaReward user={user} db={db} redeem={redeemReward} />}
        {wPage === "profil" && (
          <WargaProfil user={user} onLogout={logout} sendFeedback={sendFeedback} />
        )}
      </Shell>
      <Toast message={toast} />
    </>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script>
</body>
</html>
